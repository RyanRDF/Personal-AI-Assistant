use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  # Overridden by the SEARXNG_SECRET environment variable from Compose.
  secret_key: "local-only-change-this-secret"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json
